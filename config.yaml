# ═══════════════════════════════════════════
# Ship Hull Agent — 全局配置文件
# ═══════════════════════════════════════════

# 对话模型
llm:
  model: "Qwen/Qwen3-VL-4B-AWQ"
  api_key: "abc123"
  base_url: "http://localhost:7890/v1"
  temperature: 0.0

# Embedding 模型
embed:
  model: "Qwen3-Embedding-0.6B"
  api_key: "abc123"
  base_url: "http://localhost:7891/v1"

# RAG 检索参数
retrieval:
  top_k: 3
  score_threshold: 0.5

# 向量库配置
vector_store:
  persist_path: "./vector_store"
  auto_rebuild: false

# 应用配置
app:
  log_level: "INFO"
  # CSV 数据库路径（相对于项目根目录）
  ship_db_path: "./data/ships.csv"

# Pipeline 视频处理流水线配置
pipeline:
  # 级联/并发双模式
  # false = 级联模式：同步等待 Agent 返回结果（简单但阻塞，FPS 低）
  # true  = 并发模式：YOLO 不等待，Agent 异步推理（推荐，FPS 高）
  concurrent_mode: false

  # 最大并发 Agent 推理数
  max_concurrent: 1

  # 最大队列深度（并发模式下防止 OOM）
  max_queued_frames: 30

  # 每 N 帧处理一次（1 = 每帧都处理，15 = 每 15 帧触发一次 Agent）
  # 并发模式下可设较小值（不阻塞），级联模式下建议设大（减少阻塞）
  process_every_n_frames: 15

  # 截图保存目录（每 N 帧触发时保存带检测框的渲染帧）
  output_dir: "./output"

  # 截图保存开关：true 则在识别到船只时自动保存截图，false 关闭
  save_screenshots: true

  # 提示词模式："detailed"（详细）或 "brief"（简略）
  prompt_mode: "detailed"

  # 定时刷新开关：true 则每隔 gap_num 帧对已识别的 track 重新进行识别
  # false 则仅在新 track 出现时识别一次
  enable_refresh: false

  # 刷新间隔帧数（仅在 enable_refresh=true 时生效）
  gap_num: 150

  # Demo 开关：true 开启视频 demo 可视化，false 关闭
  demo: false

  # YOLO 模型路径
  yolo_model: "yolov8n.pt"

  # 推理设备："" 自动选择，"cpu" 强制 CPU，"0" 表示 GPU 0
  device: ""

  # 检测置信度阈值
  conf_threshold: 0.25

  # Crop 尺寸归一化：小的放大、大的缩小，统一到此范围
  crop_min_size: 512
  crop_max_size: 1024

  # 每 N 帧检测一次 YOLO（1 = 每帧检测，2 = 隔帧检测可翻倍 FPS）
  detect_every_n_frames: 5

  # 追踪算法："bytetrack" 或 "botsort"
  tracker: "bytetrack"

  # 追踪器详细参数（传给 YOLO tracker YAML）
  # 设为 null 则使用 ultralytics 内置默认值
  tracker_params:
    track_high_thresh: 0.5     # 高置信度阈值（首次匹配）
    track_low_thresh: 0.05     # 低置信度阈值（二次匹配，降低以减少 track 碎片化）
    new_track_thresh: 0.6      # 新轨迹创建阈值
    track_buffer: 90           # 丢失后保留帧数（增大以减少 track 碎片化）
    match_thresh: 0.5          # 匹配 IoU 阈值（降低以更宽松匹配）
    # botsort 专用（bytetrack 忽略）
    # proximity_thresh: 0.5
    # appearance_thresh: 0.25
    # gmc_method: "sparseOptFlow"

  # 只检测 COCO 类别 8（船），null 表示检测所有类别
  detect_classes:
    - 8

  # 超过此帧数未出现的 track 被清理
  max_stale_frames: 30
# ═══════════════════════════════════════════
# 弦号定位（PaddleOCR TextDetection）
# ═══════════════════════════════════════════
hull_locator:
  # 开关
  enabled: true

  # ── 后处理过滤（我们自己的参数） ──
  score_threshold: 0.0          # 文字检测置信度阈值（模型返回后过滤）
  min_area: 0                   # 最小文字区域面积（像素²），过滤噪声

  # ── 通用参数 ──
  det_algorithm: "DB"           # 检测算法：DB, EAST, SAST, PSE, DB++, FCE
  det_model_dir: null           # 检测模型路径（null 使用默认模型）
  det_limit_side_len: 960       # 图像边长限制（像素）
  det_limit_type: "max"         # 边长限制类型：max / min
  max_batch_size: 10            # 预测 batch size
  det_box_type: "quad"          # 框类型：quad（四点）/ poly（多边形，弯曲文本）

  # ── DB 算法参数 ──
  det_db_thresh: 0.3            # 概率图阈值：得分 > 此值的像素视为文字
  det_db_box_thresh: 0.6        # 框阈值：框内平均得分 > 此值才保留
  det_db_unclip_ratio: 1.5      # 膨胀系数：Vatti clipping 扩张系数
  use_dilation: false           # 是否对分割结果做膨胀
  det_db_score_mode: "fast"     # 得分计算：fast（外接矩形）/ slow（原始 polygon）

  # ── EAST 算法参数 ──
  det_east_score_thresh: 0.8    # score map 阈值
  det_east_cover_thresh: 0.1    # 文本框平均得分阈值
  det_east_nms_thresh: 0.2      # NMS 阈值

  # ── SAST 算法参数 ──
  det_sast_score_thresh: 0.5    # 得分阈值
  det_sast_nms_thresh: 0.5      # NMS 阈值

  # ── PSE 算法参数 ──
  det_pse_thresh: 0.0           # 二值化阈值
  det_pse_box_thresh: 0.85      # box 过滤阈值
  det_pse_min_area: 16          # 最小面积
  det_pse_scale: 1              # 输入/输出图比例（调大加速但降精度）
