# ═══════════════════════════════════════════
# Ship Hull Agent — 全局配置文件
# ═══════════════════════════════════════════

# 对话模型
llm:
  model: "Qwen/Qwen3-VL-4B-AWQ"
  api_key: "abc123"
  base_url: "http://localhost:7890/v1"
  temperature: 0.0

# Embedding 模型
embed:
  model: "Qwen3-Embedding-0.6B"
  api_key: "abc123"
  base_url: "http://localhost:7891/v1"

# RAG 检索参数
retrieval:
  top_k: 3
  score_threshold: 0.5

# 向量库配置
vector_store:
  persist_path: "./vector_store"
  auto_rebuild: false

# 应用配置
app:
  log_level: "INFO"
  # CSV 数据库路径（相对于项目根目录）
  ship_db_path: "./data/ships.csv"

# Pipeline 视频处理流水线配置
pipeline:
  # 级联/并发双模式
  # false = 级联模式：同步等待 Agent 返回结果（简单但阻塞，FPS 低）
  # true  = 并发模式：YOLO 不等待，Agent 异步推理（推荐，FPS 高）
  concurrent_mode: false

  # 最大并发 Agent 推理数
  max_concurrent: 1

  # 最大队列深度（并发模式下防止 OOM）
  max_queued_frames: 30

  # 每 N 帧处理一次（1 = 每帧都处理，15 = 每 15 帧触发一次 Agent）
  # 并发模式下可设较小值（不阻塞），级联模式下建议设大（减少阻塞）
  process_every_n_frames: 15

  # 截图保存目录（每 N 帧触发时保存带检测框的渲染帧）
  output_dir: "./output"

  # 截图保存开关：true 则在识别到船只时自动保存截图，false 关闭
  save_screenshots: true

  # 提示词模式："detailed"（详细）或 "brief"（简略）
  prompt_mode: "detailed"

  # 定时刷新开关：true 则每隔 gap_num 帧对已识别的 track 重新进行识别
  # false 则仅在新 track 出现时识别一次
  enable_refresh: false

  # 刷新间隔帧数（仅在 enable_refresh=true 时生效）
  gap_num: 150

  # Demo 开关：true 开启视频 demo 可视化，false 关闭
  demo: false

  # YOLO 模型路径
  yolo_model: "yolov8n.pt"

  # 推理设备："" 自动选择，"cpu" 强制 CPU，"0" 表示 GPU 0
  device: ""

  # 检测置信度阈值
  conf_threshold: 0.25

  # Crop 尺寸归一化：小的放大、大的缩小，统一到此范围
  crop_min_size: 224
  crop_max_size: 448

  # 每 N 帧检测一次 YOLO（1 = 每帧检测，2 = 隔帧检测可翻倍 FPS）
  detect_every_n_frames: 5

  # 追踪算法："bytetrack" 或 "botsort"
  tracker: "bytetrack"

  # 追踪器详细参数（传给 YOLO tracker YAML）
  # 设为 null 则使用 ultralytics 内置默认值
  tracker_params:
    track_high_thresh: 0.5     # 高置信度阈值（首次匹配）
    track_low_thresh: 0.05     # 低置信度阈值（二次匹配，降低以减少 track 碎片化）
    new_track_thresh: 0.6      # 新轨迹创建阈值
    track_buffer: 90           # 丢失后保留帧数（增大以减少 track 碎片化）
    match_thresh: 0.5          # 匹配 IoU 阈值（降低以更宽松匹配）
    # botsort 专用（bytetrack 忽略）
    # proximity_thresh: 0.5
    # appearance_thresh: 0.25
    # gmc_method: "sparseOptFlow"

  # 只检测 COCO 类别 8（船），null 表示检测所有类别
  detect_classes:
    - 8

  # 超过此帧数未出现的 track 被清理
  max_stale_frames: 30
# ═══════════════════════════════════════════
# 弦号定位
# ═══════════════════════════════════════════
# 支持两种检测器：
#   - "paddle"：PaddleOCR TextDetection（文字检测，适合通用 OCR 场景）
#   - "yolo"：YOLO 目标检测（适合训练好的弦号检测模型）

hull_locator:
  # 开关
  enabled: true

  # ── 检测器选择 ──
  detector_type: "paddle"       # "paddle" 或 "yolo"

  # ── 后处理过滤（我们自己的参数） ──
  score_threshold: 0.0          # 检测置信度阈值（模型返回后过滤）
  min_area: 0                   # 最小检测区域面积（像素²），过滤噪声

  # ── Crop 保存（调试用） ──
  save_crops: true              # 是否保存矫正前后的 crop
  crop_save_dir: "./crops"      # crop 保存目录
  crop_save_interval: 10        # 保存间隔（秒）

  # ── 图像预处理（检测前对 crop 做处理） ──
  # 按顺序执行，留空则不做预处理
  # 可选算法：wavelet_denoise, convolution_sharpen, clahe_enhance,
  #           gaussian_blur, median_blur, bilateral_denoise,
  #           unsharp_mask, grayscale, adaptive_threshold,
  #           gamma_correction, contrast_stretching, retinex,
  #           edge_enhance, tophat,
  #           shadow_adjust, exposure_adjust, contrast_adjust
  # 当前启用的预处理流水线（按顺序执行）
  preprocess_steps:
    - name: "shadow_adjust"
      params: { shadow_amount: 10 }     # 0-100，提亮暗区程度
    - name: "retinex"
      params: { sigma: 30 }             # 去光照（10-50，越大范围越广）
    - name: "gamma_correction"
      params: { gamma: 0.5 }            # <1 变亮，>1 变暗（0.3-3.0）
    - name: "wavelet_denoise"
      params: { level: 1, threshold: 12.0 }  # level: 分解层数(1-3), threshold: 去噪阈值(越大越强)
    - name: "convolution_sharpen"
      params: { strength: 3.0, kernel_size: 7 }  # strength: 锐化强度, kernel_size: 核大小(奇数)

  # ── 所有可选算法及参数 ──
  #
  # --- 去噪类 ---
  # - name: "wavelet_denoise"          # 小波变换去噪
  #   params: { method: "haar", level: 1, threshold: 10.0 }
  #     method: 小波基函数 ("haar", "db1", "db2")
  #     level: 分解层数，1-3（越大越模糊）
  #     threshold: 去噪阈值，10-50（越大越强）
  #
  # - name: "gaussian_blur"            # 高斯模糊去噪
  #   params: { ksize: 3, sigma: 1.0 }
  #     ksize: 核大小，奇数（3-7）
  #     sigma: 标准差（0.5-2.0）
  #
  # - name: "median_blur"              # 中值滤波（椒盐噪声效果好）
  #   params: { ksize: 3 }
  #     ksize: 核大小，奇数（3-7）
  #
  # - name: "bilateral_denoise"        # 双边滤波（保边去噪）
  #   params: { d: 9, sigma_color: 75, sigma_space: 75 }
  #     d: 像素邻域直径（5-15）
  #     sigma_color: 颜色标准差（50-150）
  #     sigma_space: 空间标准差（50-150）
  #
  # --- 锐化类 ---
  # - name: "convolution_sharpen"      # 卷积锐化（Unsharp Mask）
  #   params: { strength: 1.5, kernel_size: 3 }
  #     strength: 锐化强度（0.5-3.0）
  #     kernel_size: 核大小，奇数（3-7）
  #
  # - name: "unsharp_mask"             # USM 锐化
  #   params: { sigma: 1.0, strength: 1.5 }
  #     sigma: 模糊范围（0.5-3.0）
  #     strength: 锐化强度（0.5-3.0）
  #
  # - name: "edge_enhance"             # 拉普拉斯边缘增强
  #   params: { strength: 0.7 }
  #     strength: 增强强度（0.3-1.5）
  #
  # --- 对比度/亮度类 ---
  # - name: "clahe_enhance"            # CLAHE 自适应对比度增强
  #   params: { clip_limit: 2.0, grid_size: 8 }
  #     clip_limit: 对比度限制（1.0-4.0）
  #     grid_size: 网格大小（4-16）
  #
  # - name: "contrast_stretching"      # 对比度拉伸（线性归一化）
  #   params: { low_percent: 2.0, high_percent: 98.0 }
  #     low_percent: 低百分位（0-10）
  #     high_percent: 高百分位（90-100）
  #
  # - name: "gamma_correction"         # Gamma 亮度校正
  #   params: { gamma: 1.0 }
  #     gamma: <1 变亮，>1 变暗（0.3-3.0）
  #
  # - name: "exposure_adjust"          # 曝光调节
  #   params: { exposure: 0 }
  #     exposure: -100~100（负值变暗，正值变亮）
  #
  # - name: "contrast_adjust"          # 对比度调节
  #   params: { contrast: 0 }
  #     contrast: -100~100（负值降低，正值增强）
  #
  # --- 阴影/光照类 ---
  # - name: "shadow_adjust"            # 阴影调节（提亮暗区）
  #   params: { shadow_amount: 50 }
  #     shadow_amount: 0-100（提亮程度）
  #
  # - name: "retinex"                  # Retinex 增强（去雾/去阴影）
  #   params: { sigma: 30 }
  #     sigma: 10-50（去除的光照范围）
  #
  # --- 形态学类 ---
  # - name: "tophat"                   # 顶帽变换（文字增强）
  #   params: { kernel_size: 15 }
  #     kernel_size: 结构元素大小（11-21）
  #
  # --- 二值化类 ---
  # - name: "adaptive_threshold"       # 自适应阈值二值化
  #   params: { block_size: 11, c: 2 }
  #     block_size: 邻域大小，奇数（11-31）
  #     c: 常数偏移（2-10）
  #
  # - name: "grayscale"                # 灰度转换（无参数）

  # ═══════════════════════════════════════════
  # PaddleOCR 检测器参数（detector_type: "paddle" 时生效）
  # ═══════════════════════════════════════════

  # ── 模型选择 ──
  model_name: null              # 模型名（null = 默认 PP-OCRv5_server_det）
  model_dir: null               # 本地模型目录（null = 自动下载）

  # ── 通用检测参数 ──
  limit_side_len: 960           # 图像边长限制（像素）
  limit_type: "max"             # 边长限制类型：max（最长边 ≤ 此值）/ min（最短边 ≥ 此值）
  max_side_limit: null           # 最大边长硬限制（像素）
  input_shape: null             # 模型输入形状 (C, H, W)

  # ── 后处理阈值参数 ──
  thresh: 0.01                   # 概率图阈值：得分 > 此值的像素视为文字
  box_thresh: 0.01               # 框阈值：框内平均得分 > 此值才保留
  unclip_ratio: 1.5             # 膨胀系数：Vatti clipping 扩张系数

  # ── 推理引擎参数 ──
  device: null                  # 推理设备：null 自动 / "cpu" / "gpu" / "gpu:0"
  engine: null                  # 推理引擎：null / paddle_static / paddle_dynamic / transformers
  engine_config: null           # 推理引擎配置（dict）
  enable_hpi: false             # 高性能推理
  precision: "fp32"             # TensorRT 精度：fp32 / fp16
  use_tensorrt: false           # 启用 TensorRT（GPU 加速）
  enable_mkldnn: true           # 启用 MKL-DNN（CPU 加速）
  mkldnn_cache_capacity: 10     # MKL-DNN 缓存容量
  cpu_threads: 10               # CPU 线程数

  # ═══════════════════════════════════════════
  # YOLO 检测器参数（detector_type: "yolo" 时生效）
  # ═══════════════════════════════════════════

  # ── 模型配置 ──
  yolo_model: "best.pt"         # YOLO 模型路径（训练好的弦号检测模型）
  yolo_model_name: null         # 模型名（null = 使用 yolo_model 路径）

  # ── 检测参数 ──
  yolo_conf: 0.25               # 检测置信度阈值
  yolo_iou: 0.45                # NMS IoU 阈值
  yolo_imgsz: 640               # 输入图像尺寸
  yolo_device: "0"               # 推理设备："" 自动 / "cpu" / "0" GPU
  yolo_classes: null            # 检测类别（null = 所有类别）
